name: Build device-specific RAM data reset candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3 git gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Test target and partition guards
        run: |
          cc -std=c11 -Wall -Wextra -Werror card-reset/guard.c card-reset/test_guard.c -o /tmp/card-reset-guard-test
          /tmp/card-reset-guard-test
          python3 -m unittest discover -s card-reset -p 'test_*.py' -v
      - name: Fetch reviewed SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" checkout --detach a1438dff1d38bd9c65dbd693f0e5db4b9ae91779
      - name: Compile RAM-only candidate
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          mkdir output
          for mode in OFF ON; do
            cmake -S card-reset -B "build-$mode" -G Ninja -DPICO_BOARD=waveshare_rp2350_one -DCMAKE_BUILD_TYPE=Release -DRECOVERY_EXECUTE_ERASE="$mode"
            cmake --build "build-$mode" --parallel 2
            python3 card-reset/verify_ram_elf.py "build-$mode/card_data_recovery.elf"
            if [ "$mode" = OFF ]; then name=probe; else name=erase; fi
            cp "build-$mode/card_data_recovery.elf" "output/card-data-$name.elf"
            arm-none-eabi-objdump -d "build-$mode/card_data_recovery.elf" > "output/card-data-$name.disasm.txt"
            arm-none-eabi-readelf -lW "build-$mode/card_data_recovery.elf" > "output/card-data-$name.segments.txt"
            find "build-$mode" -name '*.su' -exec cat {} + > "output/card-data-$name.stack.txt"
            if [ "$mode" = OFF ]; then
              for stage in 0 1; do
                python3 card-reset/verify_ram_elf.py "build-$mode/stage_probe_$stage.elf"
                cp "build-$mode/stage_probe_$stage.elf" "output/stage-probe-$stage.elf"
                arm-none-eabi-objdump -d "build-$mode/stage_probe_$stage.elf" > "output/stage-probe-$stage.disasm.txt"
              done
            fi
          done
          cp card-reset/{main.c,stage_probe.c,guard.c,guard.h,test_guard.c,verify_ram_elf.py,CMakeLists.txt} output/
          sha256sum output/* > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: card-specific-data-reset-candidate
          path: output/
          if-no-files-found: error
          retention-days: 30
