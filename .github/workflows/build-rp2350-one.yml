name: Build Zero-CM UAC reviewed A and B
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3 git gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Test firmware policy and verifier
        run: |
          python3 -m unittest discover -s firmware/tests -p 'test_*.py' -v
          for flags in '' '-DPICO_YKMD_ALLOW_PUK_RESET=1' '-DPICO_YKMD_ALLOW_PIN_CHANGE=1' '-DPICO_YKMD_ALLOW_PUK_RESET=1 -DPICO_YKMD_ALLOW_PIN_CHANGE=1'; do
            cc -std=c11 -Wall -Wextra -Werror $flags -I firmware/patches firmware/tests/ykmd_existing_keys_test.c -o /tmp/zero-cm-policy
            /tmp/zero-cm-policy
          done
      - name: Fetch pinned upstream and SDK
        run: |
          git clone https://github.com/polhenarejos/pico-openpgp.git source
          git -C source checkout --detach c4869b583fae346fb1f6bd6fef7b7fb833c12c43
          git -C source submodule update --init --recursive
          test "$(git -C source/pico-keys-sdk rev-parse HEAD)" = b35df81a03ed4248680bc5f2099d4fd97e71baf8
          git clone https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" checkout --detach a1438dff1d38bd9c65dbd693f0e5db4b9ae91779
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --recursive --depth 1
      - name: Apply reviewed protocol and 2MB board profile
        run: |
          git -C source apply --check "$GITHUB_WORKSPACE/firmware/patches/pico-v5-ykmd-ecdh.patch"
          git -C source apply "$GITHUB_WORKSPACE/firmware/patches/pico-v5-ykmd-ecdh.patch"
          cp firmware/patches/ykmd_existing_keys.h source/src/openpgp/ykmd_existing_keys.h
          python3 firmware/scripts/prepare_zero_cm.py source
          python3 firmware/scripts/patch_pico_usb_branding.py --file source/pico-keys-sdk/src/usb/usb_descriptors.c --manufacturer DGSRZ --product DGS-Seckey-UAC --landing-url https://dgs-druckguss.com --disable-landing
          git -C source diff --check
          git -C source/pico-keys-sdk diff --check
      - name: Build A and B with identical board and data partitions
        run: |
          for stage in a b; do
            guard=OFF
            if [ "$stage" = b ]; then guard=ON; fi
            cmake -S source -B "build-$stage" -G Ninja \
              -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" \
              -DPICO_BOARD_HEADER_DIRS="$GITHUB_WORKSPACE/firmware/boards" \
              -DPICO_BOARD=waveshare_rp2350_zero_cm -DCMAKE_BUILD_TYPE=Release \
              -DPICO_PIV_ECDH_TEST=OFF -DPICO_YKMD_ATR_TEST=ON \
              -DPICO_YKMD_EXISTING_KEYS_ONLY="$guard" \
              -DPICO_YKMD_ALLOW_PUK_RESET=ON -DPICO_YKMD_ALLOW_PIN_CHANGE=ON
            cmake --build "build-$stage" --parallel 2
            mkdir -p "output/$stage"
            cp "build-$stage/pico_openpgp.uf2" "output/$stage/"
            cp "build-$stage/pico_openpgp.elf" "output/$stage/"
            find "build-$stage" -name '*.map' -exec cp {} "output/$stage/" \;
            PICOTOOL=$(find "build-$stage" -type f -name picotool | head -1)
            test -n "$PICOTOOL"
            "$PICOTOOL" info -a "build-$stage/pico_openpgp.uf2" > "output/$stage/picotool-info.txt"
          done
      - name: Verify and record provenance
        run: |
          python3 firmware/scripts/verify_uf2.py output/a/pico_openpgp.uf2 output/b/pico_openpgp.uf2 > output/uf2-validation.json
          cp firmware/pt-zero-cm.json output/
          cp firmware/boards/waveshare_rp2350_zero_cm.h output/
          cp firmware/patches/* output/
          git -C source diff > output/firmware-source.diff
          git -C source/pico-keys-sdk diff > output/keys-sdk-source.diff
          git -C source submodule status --recursive > output/submodules.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('output')
          data = {
              'source_commit': 'c4869b583fae346fb1f6bd6fef7b7fb833c12c43',
              'keys_sdk_commit': 'b35df81a03ed4248680bc5f2099d4fd97e71baf8',
              'pico_sdk_commit': 'a1438dff1d38bd9c65dbd693f0e5db4b9ae91779',
              'build_commit': os.environ['GITHUB_SHA'],
              'board': 'waveshare_rp2350_zero_cm', 'flash_bytes': 2097152,
              'profile': 'zero-cm-uac-9a', 'slots': ['9a'], 'usb_product': 'DGS-Seckey-UAC',
              'atr': 'ykmd', 'ecdh_9d': False, 'hardware_validation': 'pending user testing',
              'stages': {'a': {'existing_keys_only': False, 'change_puk': True},
                         'b': {'existing_keys_only': True, 'change_pin': True,
                               'puk_pin_reset': True, 'change_puk': False, 'factory_reset': False}},
          }
          for stage in ('a', 'b'):
              data['stages'][stage]['sha256'] = hashlib.sha256((root/stage/'pico_openpgp.uf2').read_bytes()).hexdigest()
          (root/'build-info.json').write_text(json.dumps(data, indent=2)+'\n')
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(root).as_posix()+'\n' for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'SHA256SUMS.txt'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rp2350-zero-cm-uac-reviewed-a-b
          path: output/
          if-no-files-found: error
          retention-days: 30
